name: Build and Release

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "site/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same PR supersedes the run in flight; never cancel master or tags
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  version:
    name: Validate version
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check release readiness
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          case "$EVENT_NAME" in
            pull_request) ./scripts/release-check.sh pr "origin/$BASE_REF" ;;
            push)
              case "$GITHUB_REF" in
                refs/tags/v*) ./scripts/release-check.sh tag "$REF_NAME" ;;
                refs/heads/master) ./scripts/release-check.sh master ;;
              esac ;;
          esac

  sanity:
    name: Real tmux sanity
    needs: version
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build OCI harness and test in tmux
        run: make container-test CONTAINER_ENGINE=docker CONTAINER_IMAGE=agenmux-ci:${{ github.sha }}

  build:
    name: ${{ matrix.artifact }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: agenmux-linux-x86_64
            target: x86_64-unknown-linux-musl
            binary: target/x86_64-unknown-linux-musl/release/agenmux
          - runner: ubuntu-24.04-arm
            artifact: agenmux-linux-aarch64
            target: aarch64-unknown-linux-musl
            binary: target/aarch64-unknown-linux-musl/release/agenmux
          - runner: macos-15-intel
            artifact: agenmux-macos-x86_64
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/agenmux
          - runner: macos-15
            artifact: agenmux-macos-aarch64
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/agenmux

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Linux build and test tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools tmux expect
          rustup target add "${{ matrix.target }}"

      - name: Install macOS test tools
        if: runner.os == 'macOS'
        run: brew install tmux expect

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Test
        run: |
          cargo test --locked
          cargo build --release --locked --target "${{ matrix.target }}"
          AGENMUX_BIN="${{ matrix.binary }}" ./tests/run.sh

      - name: Package plugin
        shell: bash
        run: |
          package="${{ matrix.artifact }}"
          mkdir -p "dist/$package/target/release"
          git archive HEAD | tar -x -C "dist/$package"
          cp "${{ matrix.binary }}" "dist/$package/target/release/agenmux"
          printf '%s\n' '#!/bin/sh' 'exec "$(dirname "$0")/agenmux" "$@"' \
            > "dist/$package/target/release/agents-mon"
          chmod +x "dist/$package/target/release/agents-mon"
          # macOS packages also ship the notification helper so
          # `make install-app` works without cargo
          if [ "$RUNNER_OS" = macOS ]; then
            cp "target/${{ matrix.target }}/release/agenmux-notifier" \
              "dist/$package/target/release/agenmux-notifier"
            printf '%s\n' '#!/bin/sh' 'exec "$(dirname "$0")/agenmux-notifier" "$@"' \
              > "dist/$package/target/release/agents-mon-notifier"
            chmod +x "dist/$package/target/release/agents-mon-notifier"
          fi
          tar -czf "dist/$package.tar.gz" -C dist "$package"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ matrix.artifact }}.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 14

  # A green master whose Cargo.toml names a version with no tag yet is a
  # release: tag it here so a merged bump PR publishes without a manual push.
  # The workflow's own token never fires the `push: tags` trigger below, so the
  # release job also runs in this same run when this job created the tag.
  tag:
    name: Tag release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [version, sanity, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      created: ${{ steps.tag.outputs.created }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Tag master with the manifest version
        id: tag
        run: |
          tag="$(./scripts/version.sh tag)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to publish"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ./scripts/release-check.sh master
          git tag "$tag" "$GITHUB_SHA"
          if git push origin "refs/tags/$tag"; then
            echo "created $tag at $GITHUB_SHA"
            echo "created=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            # a concurrent master run won the race; its run publishes
            echo "$tag was created by another run; nothing to publish"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            exit 1
          fi

  release:
    name: Publish ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || needs.tag.outputs.tag }}
    # a pushed tag (tag job skipped), or a master run whose tag job just made one
    if: >-
      ${{ !cancelled() &&
          needs.version.result == 'success' &&
          needs.sanity.result == 'success' &&
          needs.build.result == 'success' &&
          (startsWith(github.ref, 'refs/tags/v') || needs.tag.outputs.created == 'true') }}
    needs: [version, sanity, build, tag]
    runs-on: ubuntu-latest
    permissions:
      actions: write # dispatch pages.yml below
      contents: write
    env:
      TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || needs.tag.outputs.tag }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          tar -xOf dist/agenmux-linux-x86_64.tar.gz \
            agenmux-linux-x86_64/RELEASE_NOTES.md > RELEASE_NOTES.md
          count="$(find dist -maxdepth 1 -name 'agenmux-*.tar.gz' | wc -l)"
          test "$count" -eq 4
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # draft until every asset is up: /releases/latest (what the sidebar's
          # update notice keys on) must never name a release whose binaries
          # are still uploading
          gh release create "$TAG" \
            dist/*.tar.gz dist/SHA256SUMS \
            --draft \
            --verify-tag \
            --notes-file RELEASE_NOTES.md \
            --title "agenmux $TAG"
          gh release edit "$TAG" --draft=false

      - name: Redeploy the site with the new release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # releases made with GITHUB_TOKEN never fire `release:` triggers
        run: gh workflow run pages.yml --ref master
