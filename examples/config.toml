# agenmux application configuration.
# Copy to $XDG_CONFIG_HOME/agenmux/config.toml (or ~/.config/agenmux/config.toml).
# Every key is optional; omitted keys keep the built-in defaults. Values shown
# are the defaults unless a comment says otherwise. Validate with
# `agenmux config check`, then run `agenmux setup` and reopen the sidebar.
version = 1

[display]
mode = "split"        # split | popup
show_all_panes = false
show_frame = true      # whole-pane Agenmux frame
sidebar_width = 30    # cells, 1..=10000
popup_width = 40
popup_height = "auto" # "auto" or cells

[behavior]
notifications = true
# hide_windows = "agents*" # filter the prefix+w picker; omitted leaves it alone

[tmux_management]
# cc/cs create, dd deletes the selected session/window/pane, r renames
enabled = false
confirm_delete = true

# Quick launchers are available only when tmux management is enabled.
# These entries show the built-in defaults and can be omitted when unchanged.
[quick_launchers.nvim]
sequence = "e"
label = "nvim"
command = "nvim"
args = []
working_directory = "selected" # selected pane cwd, or the tmux session default
enabled = true

[quick_launchers.lazygit]
sequence = "og"
label = "lazygit"
command = "lazygit"
args = []
working_directory = "selected"
enabled = true

# A custom launcher entry needs all three fields below; args, working_directory,
# and enabled have defaults.
# [quick_launchers.tests]
# sequence = "ot"
# label = "cargo test"
# command = "cargo"
# args = ["test"]
# working_directory = "selected"
# enabled = true

[theme]
base = "dark"         # dark | light | terminal
[theme.colors]        # semantic overrides: "default", 0..255, or "#RRGGBB"
# working_bg = "#fff0cc"
# pane_bg = 236       # selected ordinary pane row
# header_bg = "default"

[keys]
sequence_timeout_ms = 1000 # positive integer milliseconds

[keys.normal]         # each list replaces the default list; [] unbinds
down = ["j", "Down"]
up = ["k", "Up"]
jump = ["Enter", "l"]
search = ["/"]
filter = ["f"]
reset = ["Escape"]
help = ["?"]
versions = ["u"]
settings = ["s"]
close = ["q", "Q"]

[keys.search]         # printable keys are query text and cannot be bound
up = ["Up", "C-p"]
down = ["Down", "C-n"]
accept = ["Enter"]
cancel = ["Escape", "C-c"]
backspace = ["BSpace"]
clear = ["C-u"]
