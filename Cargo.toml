[package]
name = "agents-mon"
version = "0.1.12"
edition = "2021"

[dependencies]
regex = "1"
libc = "0.2"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

# native notifications for the AgentsMon.app helper (src/bin/agents-mon-notifier.rs)
[target.'cfg(target_os = "macos")'.dependencies]
mac-usernotifications = "0.3.1"

[profile.release]
strip = true
lto = true
