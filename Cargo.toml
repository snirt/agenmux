[package]
name = "agenmux"
version = "0.4.0"
edition = "2021"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
libc = "0.2"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

# native notifications for the Agenmux.app helper (src/bin/agenmux-notifier.rs)
[target.'cfg(target_os = "macos")'.dependencies]
mac-usernotifications = "0.3.1"

[profile.release]
opt-level = "z"
strip = true
lto = true
panic = "abort"
codegen-units = 1
