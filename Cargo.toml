[package]
name = "agenmux"
version = "0.3.0"
edition = "2021"

[dependencies]
regex = "1"
libc = "0.2"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

# native notifications for the Agenmux.app helper (src/bin/agenmux-notifier.rs)
[target.'cfg(target_os = "macos")'.dependencies]
mac-usernotifications = "0.3.1"

[profile.release]
strip = true
lto = true
