# Pi — rules ported from herdr src/detect/manifests/pi.toml (working-only upstream too)
AGENT_BINS="pi"
AGENT_PATH_HINTS="pi-coding-agent"
AGENT_ICON="Pı" # the logo's P and dotless i; no Nerd Fonts glyph exists for Pi
AGENT_RESUME="pi --continue"

# The status line sits above the editor. pi's own editor embeds it in its top
# border ("── ⠙ Working ───", only the spinner when narrow); an editor an
# extension installs gets it as a line of its own (" ⠙ Working"). Match pi's
# spinner frames in either spot (working, retry, compaction), or the default
# "Working" label behind an extension's custom frame. Case-sensitive, and that
# frame is one or two glyphs, never a word or a check mark, so a prompt like
# "not working" or a "✓ Working" summary stays idle.
WORKING_SCREEN='(?-i)^(─{1,3} ?| )?([⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏]( |─|$)|([^\s\w✓✔✗✘]{1,2} )?Working( ─|$))'
BLOCKED_SCREEN='^ Enter to select · .*Esc to cancel'
# Widgets above the editor (todos, recaps) push the status line up.
SCREEN_LINES=40

CHECK_ORDER="ws bs"

TITLE_STRIP='^π - '

# unnamed sessions carry no title subject — pull session name / first user
# message from the pane's session file. Nothing in pi ties a pane to a file
# (several pi in one cwd share a sessions dir, /new opens a new file), so:
# candidates are the 10 newest-modified files, those created after the agent
# process started ($started, UTC YYYY-MM-DDTHH-MM-SS — the prefix pi names
# files with) ahead of the rest (resumed sessions predate it); the first whose
# last user message is visible in the scrollback of $pane belongs to it — pi
# renders prompts as " <text>" lines, so short ones must match a whole line
# and long ones contain the 40-char prefix ("go" alone matches every pane).
# No scrollback match (cleared screen, history limit, fresh /new): first that
# yields anything. pi stubs an empty file on launch, hence the yield check.
# Ties only if two panes got the same prompt.
# Cost stays bounded however many or large the session files are (#256): 10
# candidates, only each file's first and last MiB is read (first user message
# from the head, last prompt and session name from the tail), and a fixed
# handful of processes run however many candidates there are — one head, tail,
# grep, awk, and tmux capture, no per-file pipelines. Sessions older than the
# newest 10 show no subject.
SUBJECT_CMD='dir="$HOME/.pi/agent/sessions/-${path//\//-}--"
  top=()
  for f in "$dir"/*.jsonl; do
    [ -f "$f" ] || continue
    i=${#top[@]}
    while [ "$i" -gt 0 ] && [ "$f" -nt "${top[i-1]}" ]; do i=$((i - 1)); done
    [ "$i" -lt 10 ] && top=("${top[@]:0:i}" "$f" "${top[@]:i:9-i}")
  done
  [ ${#top[@]} -gt 0 ] || exit 0
  own=() rest=()
  for f in "${top[@]}"; do
    b=${f##*/}
    if [ -n "$started" ] && [[ ! "${b:0:19}" < "$started" ]]; then own+=("$f"); else rest+=("$f"); fi
  done
  cands=("${own[@]}" "${rest[@]}")
  IFS="
"
  read -r -d "" prog <<\AWK
BEGIN { nc = split(ENVIRON["cands"], cand, "\n"); for (i = 1; i <= nc; i++) known[cand[i]]; cur = nc == 1 ? cand[1] : "" }
FILENAME == ARGV[1] {
  if ($0 ~ /^==> .* <==$/ && substr($0, 5, length($0) - 8) in known) { cur = substr($0, 5, length($0) - 8); next }
  if (cur == "") next
  if (index($0, "\"type\":\"session_info\"")) {
    name[cur] = match($0, /"name":"[^"]*"/) ? substr($0, RSTART + 8, RLENGTH - 9) : ""
  } else if (index($0, "\"type\":\"message\"") && index($0, "\"role\":\"user\"") && match($0, /"(text|content)":"/)) {
    t = substr($0, RSTART + RLENGTH); q = index(t, "\""); if (q) t = substr(t, 1, q - 1)
    if (!(cur in first)) first[cur] = t
    b = index(t, "\\"); if (b) t = substr(t, 1, b - 1)
    last[cur] = substr(t, 1, 40)
  }
  next
}
{ seen[$0]; lines[++ns] = $0 }
END {
  for (i = 1; i <= nc && pick == ""; i++) {
    l = " " last[cand[i]]; if (l == " ") continue
    if (length(l) < 41) { if (l in seen) pick = cand[i]; continue }
    for (j = 1; j <= ns; j++) if (index(lines[j], l)) { pick = cand[i]; break }
  }
  if (pick != "") { s = name[pick] != "" ? name[pick] : first[pick]; if (s != "") { print s; exit } }
  for (i = 1; i <= nc; i++) { s = name[cand[i]] != "" ? name[cand[i]] : first[cand[i]]; if (s != "") { print s; exit } }
}
AWK
  cands="${cands[*]}" awk "$prog" \
    <({ head -c 262144 -- "${cands[@]}"; echo; tail -c 262144 -- "${cands[@]}"; } 2>/dev/null |
      grep -F -e "\"role\":\"user\"" -e "\"type\":\"session_info\"" -e " <==") \
    <(tmux capture-pane -p -t "$pane" -S - 2>/dev/null)'
