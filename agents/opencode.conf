# OpenCode — rules ported from herdr src/detect/manifests/opencode.toml
AGENT_BINS="opencode open-code"
AGENT_ICON="OC" # OpenCode's own title prefix; no OpenCode glyph in Nerd Fonts

BLOCKED_SCREEN='△ Permission required|esc dismiss.*(enter confirm|enter submit|enter toggle)|(enter confirm|enter submit|enter toggle).*esc dismiss'
WORKING_SCREEN='esc to interrupt|ctrl\+c to interrupt|press esc to interrupt|esc again to interrupt|(■|⬝){4,}'

CHECK_ORDER="bs ws"

TITLE_STRIP='^OC \| '
