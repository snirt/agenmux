TITLE_STRIP='^[⠀⠁⠂⠃⠄⠅⠆⠇⠈⠉⠊⠋⠌⠍⠎⠏⠐⠑⠒⠓⠔⠕⠖⠗⠘⠙⠚⠛⠜⠝⠞⠟⠠⠡⠢⠣⠤⠥⠦⠧⠨⠩⠪⠫⠬⠭⠮⠯⠰⠱⠲⠳⠴⠵⠶⠷⠸⠹⠺⠻⠼⠽⠾⠿⡀⡁⡂⡃⡄⡅⡆⡇⡈⡉⡊⡋⡌⡍⡎⡏⡐⡑⡒⡓⡔⡕⡖⡗⡘⡙⡚⡛⡜⡝⡞⡟⡠⡡⡢⡣⡤⡥⡦⡧⡨⡩⡪⡫⡬⡭⡮⡯⡰⡱⡲⡳⡴⡵⡶⡷⡸⡹⡺⡻⡼⡽⡾⡿⢀⢁⢂⢃⢄⢅⢆⢇⢈⢉⢊⢋⢌⢍⢎⢏⢐⢑⢒⢓⢔⢕⢖⢗⢘⢙⢚⢛⢜⢝⢞⢟⢠⢡⢢⢣⢤⢥⢦⢧⢨⢩⢪⢫⢬⢭⢮⢯⢰⢱⢲⢳⢴⢵⢶⢷⢸⢹⢺⢻⢼⢽⢾⢿⣀⣁⣂⣃⣄⣅⣆⣇⣈⣉⣊⣋⣌⣍⣎⣏⣐⣑⣒⣓⣔⣕⣖⣗⣘⣙⣚⣛⣜⣝⣞⣟⣠⣡⣢⣣⣤⣥⣦⣧⣨⣩⣪⣫⣬⣭⣮⣯⣰⣱⣲⣳⣴⣵⣶⣷⣸⣹⣺⣻⣼⣽⣾⣿] '
# idle codex titles the pane with the dir. The screen is no help: the composer
# renders "› <rotating placeholder>" below the transcript, so a last-"› ..."
# scrape always returns the placeholder, never the user's message. Pull the
# first real user message from the newest rollout for the pane's cwd instead.
#
# The candidate window must be wide: capping it at the 20 newest rollouts let a
# single busy worktree fill the window and starved every other codex pane of a
# subject. cwd lives on line 1, so one awk pass reads two lines per file and
# stops at the first match — 400 files costs ~0.3s worst case, and scan.rs
# caches the answer per pane. Skip codex's injected AGENTS.md preamble: it is
# recorded as a user message but is not what the user typed.
# ponytail: newest-rollout-by-cwd heuristic; wrong pick if two codex sessions share a cwd
SUBJECT_CMD='f=$(ls -t "$HOME/.codex/sessions"/*/*/*/rollout-*.jsonl 2>/dev/null |
    head -n 400 | tr "\n" "\0" |
    xargs -0 awk -v p="\"cwd\":\"$path\"" "FNR==1 && index(\$0,p){print FILENAME; exit} FNR>1{nextfile}" 2>/dev/null |
    head -n 1)
  [ -n "$f" ] || exit 0
  grep "\"role\":\"user\"" "$f" |
    sed -nE "s/.*\"text\":\"([^<\"][^\"\\\\]*).*/\1/p" |
    grep -v "^# AGENTS.md" | head -n 1'
